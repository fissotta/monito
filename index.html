<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MONITO</title>
<style>
:root {
  --bg: #f4f6f9; --card: #ffffff; --text: #1b2430; --muted: #6b7686; --track: #e3e8ef; --border: #dde3ec;
  --ok: #16a34a; --warn: #f59e0b; --bad: #dc2626; --off: #9aa4b2; --accent: #2563eb; --we: #c2410c;
  --sky1: #cfe4ff; --sky2: #f2f8ff; --sky-text: #4a5a78; --stars: 0; --cloud: #ffffff;
}
:root[data-theme="dark"] {
  --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b96a5; --track: #262d38; --border: #2a313c;
  --ok: #3fb950; --warn: #f0a030; --bad: #f85149; --off: #6b7686; --accent: #58a6ff; --we: #fb923c;
  --sky1: #070d1f; --sky2: #16264a; --sky-text: #a9bbdc; --stars: 1; --cloud: #3b4d73;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  transition: background .3s, color .3s;
}
header {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 6px 6px; max-width: none; margin: 0;
}
.controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
h1 { font-size: 20px; margin: 0; letter-spacing: .12em; }
.layout { display: flex; align-items: flex-start; gap: 10px; padding: 0 6px 24px; max-width: none; margin: 0; }
.side { position: sticky; top: 12px; z-index: 46; flex: none; width: clamp(170px, 17vw, 360px); display: flex; flex-direction: column; gap: 10px; }
.clockbox { position: relative; }
.clock { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.05; padding: clamp(10px, 1.4vw, 24px) 8px;
  border-radius: 16px; font-variant-numeric: tabular-nums; min-height: 0; }
.clock > b { font-size: clamp(30px, 4.2vw, 92px); letter-spacing: -.03em; }
.clock > span.d { font-size: clamp(18px, 2.4vw, 48px); font-weight: 600; }
.clock > small { font-size: clamp(13px, 1.5vw, 28px); color: var(--muted); text-transform: capitalize; }
.clock .next { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 100%; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border);
  font-size: clamp(11px, 1.05vw, 19px); line-height: 1.25; text-align: center; }
.clock .next:empty { display: none; }
.clock .next i { font-style: normal; color: var(--muted); }
.clock .next strong { font-size: 1.25em; }
.clock .next .cd { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.weather { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 16px; text-align: left; min-height: 0; }
.weather svg { flex: none; width: clamp(52px, 5vw, 100px); height: clamp(52px, 5vw, 100px); }
.weather .wx-b { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.weather .wx-t { font-size: clamp(24px, 2.6vw, 54px); font-weight: 800; line-height: 1; }
.weather .wx-s { font-size: clamp(11px, 1vw, 18px); color: var(--muted); line-height: 1.25; }
#wxPop { position: fixed; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, 94vw); max-height: 92vh; overflow: auto; padding: 12px 14px;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.35); font-size: 13.5px; }
#wxPop[hidden] { display: none; }
#semPop { position: fixed; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, 94vw); max-height: 86vh; overflow: auto; padding: 12px 14px;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.35); font-size: 14px; }
#semPop[hidden] { display: none; }
#papPop { position: fixed; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(820px, 94vw); max-height: 88vh; overflow: auto; padding: 14px 16px;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.4); font-size: 14px; }
#papPop[hidden] { display: none; }
@keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
#papPop .x { float: right; margin: 0 0 6px 8px; padding: 0 9px; min-height: 26px; font-size: 18px; line-height: 1; }
#papPop .pp-body { display: flex; gap: 18px; align-items: flex-start; }
#papPop .pp-txt { flex: 1; min-width: 0; }
#papPop .pp-tag { display: inline-block; font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
#papPop h3 { margin: 2px 0 6px; font-size: 18px; line-height: 1.25; }
#papPop h3 a { color: inherit; text-decoration: none; }
#papPop h3 a:hover { color: var(--accent); text-decoration: underline; }
#papPop .pp-meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
#papPop .pp-ab { line-height: 1.5; max-height: 46vh; overflow: auto; margin: 0; }
#papPop .pp-qr { flex: none; width: 168px; text-align: center; font-size: 12px; color: var(--muted); }
#papPop .pp-qr .qr { background: #fff; border-radius: 10px; padding: 6px; border: 1px solid var(--border); }
#papPop .pp-qr svg { display: block; width: 100%; height: auto; }
@media (max-width: 700px) { #papPop .pp-body { flex-direction: column-reverse; } #papPop .pp-qr { align-self: center; } }
#semPop .x { float: right; padding: 0 9px; min-height: 26px; font-size: 18px; line-height: 1; }
#semPop h3 { margin: 0 0 8px; font-size: 16px; }
#semPop table { width: 100%; border-collapse: collapse; }
#semPop td { padding: 5px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
#semPop td:first-child { white-space: nowrap; font-weight: 600; } #semPop td:first-child::first-letter { text-transform: uppercase; }
#semPop tr.past { opacity: .45; } #semPop tr.nx td { background: rgba(37,99,235,.14); }
#semPop .muted { color: var(--muted); }
.clock .next { cursor: pointer; }
#wxPop .x { float: right; padding: 0 9px; min-height: 26px; font-size: 18px; line-height: 1; }
#wxPop h3 { margin: 0 0 8px; font-size: 16px; }
#wxPop table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
#wxPop td { padding: 4px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
#wxPop td:first-child { text-transform: capitalize; font-weight: 600; }
#wxPop iframe { width: 100%; height: 380px; border: 0; border-radius: 10px; background: var(--track); }
#wxPop a { color: var(--accent); }
.news { flex: 1 1 0; min-width: 0; display: flex; align-items: center; height: 30px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; font-size: 13px; overflow: hidden; }
.news[hidden] { display: none; }
.news-tag { flex: none; padding: 0 12px; height: 100%; display: flex; align-items: center; font-weight: 800; color: var(--accent); border-right: 1px solid var(--border); }
.news-view { flex: 1; overflow: hidden; height: 100%; display: flex; align-items: center; }
.news-track { display: inline-flex; white-space: nowrap; animation: newsroll 400s linear infinite; will-change: transform; }
.news-track:hover { animation-play-state: paused; }
.news-track a { color: var(--text); text-decoration: none; margin-right: 40px; }
.news-track a:hover { text-decoration: underline; }
.news-track a b { color: var(--accent); margin-right: 7px; }
.news-track a i { color: var(--muted); font-style: normal; margin-left: 6px; }
.news-track a .st { color: #d4a017; margin-right: 5px; }
.eraRow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.eraRow .news { height: 30px; }
@keyframes newsroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (max-width: 900px) {
  header .news { order: 3; flex: 1 1 100%; }
  .layout { flex-direction: column; align-items: stretch; gap: 12px; }
  .side { position: static; width: 100%; }
  .clock { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 14px; }
  .clock > b { font-size: 38px; } .clock > span.d { font-size: 22px; } .clock > small { font-size: 14px; }
  .clock .next { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 2px 8px; font-size: 14px; }
}
.cal { position: absolute; left: 0; top: calc(100% + 8px); z-index: 40; width: 266px; padding: 10px; background: var(--card);
  border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.25); }
.cal[hidden] { display: none; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-weight: 700; text-transform: capitalize; }
.cal-head button { padding: 2px 10px; min-height: 28px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.cal-grid .dw { color: var(--muted); font-size: 11px; padding: 2px 0; }
.cal-grid .d { padding: 5px 0 9px; border-radius: 8px; border: 0; background: none; color: inherit; font: inherit; min-height: 0; cursor: pointer; position: relative; }
.cal-grid .d:hover { background: var(--track); }
.cal-grid .sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.cal-grid .sem::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--ok); }
.cal-grid .today.sem::after { background: #fff; }
.cal-grid .semno::after { background: none; border: 1.5px solid var(--off); width: 5px; height: 5px; }
.cal-info { margin-top: 8px; padding: 7px 9px; border-radius: 8px; background: var(--bg); font-size: 12.5px; line-height: 1.4; }
.cal-info b { font-weight: 700; }
.cal-info .muted { color: var(--muted); }
.cal-grid .we { color: var(--we); }
.cal-grid .hol { color: var(--bad); font-weight: 700; background: rgba(220,38,38,.12); }
.cal-grid .ev { border-radius: 0; }
.cal-grid .ev0 { background: rgba(124,58,237,.24); }
.cal-grid .ev1 { background: rgba(13,148,136,.26); }
.cal-grid .ev2 { background: rgba(217,119,6,.26); }
.cal-grid .evs { border-radius: 8px 0 0 8px; } .cal-grid .eve { border-radius: 0 8px 8px 0; }
.cal-info .hl { color: var(--bad); font-weight: 700; }
.cal-info .evn { font-weight: 700; }
.cal-leg { margin-top: 6px; font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.cal-leg i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.cal-grid .o { opacity: .35; }
.cal-grid .today { background: var(--accent); color: #fff; font-weight: 700; }
.cal-foot { margin-top: 8px; text-align: center; }
.cal-foot button { padding: 2px 12px; min-height: 28px; font-size: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button {
  font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; min-height: 36px;
}
body { padding-bottom: 150px; }
#eraSlot { display: flex; }
#hudChip { flex: 1; text-align: center; padding: 7px 12px; min-height: 34px; background: var(--card); border: 1px solid var(--border);
  border-radius: 999px; font-size: 13px; cursor: pointer; transition: opacity 1.6s; box-shadow: 0 2px 10px rgba(0,0,0,.12); opacity: 0; white-space: nowrap; }
#hudChip:hover { border-color: var(--accent); }
#hudChip.fl { position: fixed; z-index: 45; flex: none; padding: 4px 12px; min-height: 28px; }
#hud { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 47; display: none; width: min(540px, calc(100vw - 24px)); max-height: 80vh; overflow: auto;
  padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; font-size: 13px; line-height: 1.5;
  cursor: pointer; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
#hud.open { display: block; }
#bigMsg { position: fixed; left: 0; right: 0; top: 0; height: min(24vh, 210px); z-index: 60; display: flex; align-items: center; justify-content: center; cursor: pointer;
  background: var(--bg); border-bottom: 3px solid var(--accent); box-shadow: 0 8px 28px rgba(0,0,0,.28); animation: bmIn .45s ease; }
#bigMsg[hidden] { display: none; }
@keyframes bmIn { from { opacity: 0; transform: translateY(-40%); } to { opacity: 1; transform: none; } }
.bm-in { display: flex; align-items: center; gap: clamp(8px, 2.5vw, 32px); padding: 0 3vw; max-width: 100vw; height: 100%; }
.bm-mono { height: 92%; width: auto; flex: none; overflow: visible; }
.bm-t { font-weight: 900; font-size: clamp(24px, 4.6vw, 66px); line-height: 1.05; letter-spacing: -.02em; color: var(--accent); }
.bm-s { margin-top: .25em; font-size: clamp(14px, 2vw, 28px); font-weight: 700; line-height: 1.2; }
.bm-in.alert .bm-t { color: #e53935; animation: bmShake .5s infinite; }
@keyframes bmShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
#hud .ev { color: var(--muted); }
#toasts { position: fixed; left: 10px; bottom: 92px; z-index: 31; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.toast { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px; font-size: 12px;
  max-width: min(380px, calc(100vw - 20px)); box-shadow: 0 2px 8px rgba(0,0,0,.12); animation: tt 7s ease forwards; }
@keyframes tt { 0% { opacity: 0; transform: translateY(8px); } 6%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
#bldPop { position: fixed; z-index: 47; padding: 6px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.3); font-size: 13px; line-height: 1.35; pointer-events: none; max-width: 240px; }
#bldPop[hidden] { display: none; }
#bldPop b { font-size: 14px; }
#planetPop { position: fixed; z-index: 45; width: 280px; max-height: 70vh; overflow: auto; padding: 10px 12px; background: var(--card);
  border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.28); font-size: 12.5px; line-height: 1.4; }
#planetPop[hidden] { display: none; }
#planetPop .x { float: right; padding: 0 8px; min-height: 24px; font-size: 16px; line-height: 1; }
#planetPop .sub { color: var(--muted); margin-bottom: 4px; }
#planetPop ul { margin: 6px 0; padding-left: 18px; }
#planetPop p { margin: 6px 0 0; }
#eraBanner { position: fixed; left: 50%; bottom: 130px; z-index: 32; transform: translateX(-50%); opacity: 0; pointer-events: none;
  white-space: nowrap; font-weight: 800; font-size: clamp(15px, 3vw, 26px); padding: 8px 20px; border-radius: 999px;
  background: var(--card); border: 2px solid var(--accent); box-shadow: 0 4px 18px rgba(0,0,0,.2); }
#eraBanner.on { animation: bn 4.8s ease forwards; }
@keyframes bn { 0% { opacity: 0; transform: translate(-50%, 14px); } 10%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
#btnTheme { padding: 3px 10px; min-height: 30px; font-size: 13px; }
button { -webkit-tap-highlight-color: transparent; }
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
main {
  display: grid; gap: 10px; padding: 0; flex: 1; min-width: 0;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
}
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 14px 12px;
  transition: opacity .3s;
}
.card.stale { opacity: .55; }
.card h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font-size: 17px; }
.card h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
.live .dot { background: var(--ok); }
svg { display: block; width: 100%; max-width: 360px; margin: 0 auto; }
.ringwrap { position: relative; max-width: 360px; margin: 0 auto; }
.ringwrap svg { max-width: none; margin: 0; }
@media (min-width: 901px) {   /* 4 columnas iguales: reloj+tiempo ocupan lo mismo que cada monitor; la leyenda queda bajo akaza */
  .layout { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; }
  .side { width: auto; grid-column: 1; grid-row: 1 / span 2; }
  #grid { display: contents; }
  .legendbar { grid-column: 2 / span 3; margin-top: -4px; }
}
@media (min-width: 901px) { .ringwrap { max-width: min(360px, 27vh); } }   /* informacion arriba, civilizacion abajo: los anillos se achican segun el alto */
.ringwrap .zoo { position: absolute; left: 0; right: 0; top: 0; bottom: 0; height: 100%; pointer-events: none; overflow: visible; }
svg text { fill: var(--text); text-anchor: middle; font-family: inherit; }
.seg { transition: stroke .4s; }
.row { display: flex; justify-content: space-around; font-size: 14px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.row span b { font-weight: 600; }
.legend { color: var(--muted); font-size: 12px; text-align: center; margin-top: 6px; }
.age { color: var(--muted); font-size: 12px; text-align: center; margin-top: 2px; }
.legendbar { color: var(--muted); font-size: 12px; padding: 0 4px; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 3px 0 8px; vertical-align: baseline; }
</style>
</head>
<body>
<header>
  <h1>MONITO</h1>
  <div id="news" class="news" hidden><span class="news-tag" id="newsTag">Noticias</span><div class="news-view"><div class="news-track" id="newsTrack"></div></div></div>
  <div class="controls">
    <span class="status" id="status" aria-live="polite">—</span>
    <button id="btnTheme" title="Cambiar color: automático (por hora), día o noche"></button>
  </div>
</header>
<div class="layout">
  <aside class="side">
    <div class="clockbox">
      <button id="clock" class="clock" aria-haspopup="dialog" aria-expanded="false" title="Ver el calendario"><b id="clockTime">--:--</b><span class="d" id="clockDate">--/--</span><small id="clockDay"></small><span class="next" id="clockNext"></span></button>
      <div id="cal" class="cal" role="dialog" aria-label="Calendario" hidden></div>
    </div>
    <button id="weather" class="weather" aria-haspopup="dialog" title="Ver el tiempo de la semana"><svg id="wxIcon" viewBox="0 0 80 80" aria-hidden="true"></svg><span class="wx-b"><b class="wx-t" id="wxTemp">--°</b><span class="wx-s" id="wxText">Cargando el tiempo…</span></span></button>
    <div id="eraSlot"></div>
  </aside>
  <main id="grid"></main>
  <div class="legendbar">
  CPU por hilo y total: <span class="sw" style="background:var(--ok)"></span>&lt; 50 %
  <span class="sw" style="background:var(--warn)"></span>50–80 %
  <span class="sw" style="background:var(--bad)"></span>≥ 80 %.
  Anillo exterior: hilos (arco fino = CPU total). Anillo interior: RAM.
  <div class="eraRow"><div id="papers" class="news" hidden><span class="news-tag" id="papersTag">Papers</span><div class="news-view"><div class="news-track" id="papersTrack"></div></div></div></div>
</div>
</div>
<div id="papPop" role="dialog" aria-label="Paper" hidden></div>
<div id="semPop" role="dialog" aria-label="Seminarios" hidden></div>
<div id="wxPop" role="dialog" aria-label="El tiempo" hidden></div>

<script>
// ====== Configuración ======
const REPO = "fissotta/monito"; // "usuario/monito"  (vacío = modo demo)
const MACHINES = [
  { id: "akaza",   label: "Desktop",  animal: "mono",   plural: "monos" },
  { id: "ymir",    label: "Servidor", animal: "jirafa", plural: "jirafas" },
  { id: "inozuke", label: "Servidor", animal: "foca",   plural: "focas" },
];
const REFRESH_S = 300;                 // se actualiza cada 5 minutos
const DARK_FROM = 19, DARK_TO = 7;     // modo automático: oscuro de 19:00 a 07:00
const STALE_API = 480, STALE_RAW = 780; // s sin datos nuevos => sin conexión (cron 5 min + caché API 1 min / raw 5 min)
const WARN = 50, BAD = 80;
// ===========================

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const demo = !REPO || new URLSearchParams(location.search).has("demo");
const BUILD = "20261030w";   // subir junto con los ?v= de los <script> en cada publicacion

  // CPU total (arco fino exterior)
  s += `<path d="${arc(142, 0, 360)}" fill="none" stroke="var(--track)" stroke-width="4"/>`;
  if (d.cpu > 0) s += `<path class="seg" d="${arc(142, 0, 3.6 * d.cpu)}" fill="none" stroke="${color(d.cpu)}" stroke-width="4" stroke-linecap="round"/>`;
  // hilos
  d.cores.forEach((p, i) => {
    const a0 = i * step + gap / 2, a1 = (i + 1) * step - gap / 2;

  });

  s += `<path d="${arc(92, 0, 360)}" fill="none" stroke="var(--track)" stroke-width="14"/>`;

function render() {

  $("grid").innerHTML = MACHINES.map(m => {
    const d = state.data[m.id];
    if (!d) return `<section class="card stale"><h2><span class="dot"></span>${m.id} <small>${m.label}</small></h2>
      <div class="legend" style="padding:90px 0">Sin datos</div></section>`;

// ---------- datos ----------

  const cores = Array.from({ length: n }, () => Math.round(isNaN(forced) ? Math.random() * 100 : Math.min(100, Math.max(0, forced + (Math.random() - .5) * 30))));
  return {
    name: id, ts: Date.now() / 1000, uptime: (prev && prev.uptime != null ? prev.uptime : 86400 * (3 + n)) + 60,
    cpu: Math.round(cores.reduce((a, b) => a + b) / n), cores,
    ram: Math.round(30 + Math.random() * 60), ram_gb: n * 4, load: [n * Math.random() / 2, 0, 0], temp: 40 + Math.random() * 35,

}
async function loadAll() {
  if (demo) return Object.fromEntries(MACHINES.map(m => [m.id, fakeData(m.id, state.data[m.id])]));

    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/data.json?ref=data`,
      { headers: { Accept: "application/vnd.github.raw+json" } });
    if (!r.ok) throw new Error(r.status);
    state.stale = STALE_API;
    return await r.json();
  } catch (e) {   // sin cupo de API: raw.githubusercontent.com (caché de 5 min)
    const r = await fetch(`https://raw.githubusercontent.com/${REPO}/data/data.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    state.stale = STALE_RAW;
    return await r.json();
  }
}
async function refresh() {
  clearTimeout(state.timer);
  try { Object.assign(state.data, await loadAll()); } catch (e) { console.warn("monito:", e); }
  render();
  state.last = new Date();
  state.next = Date.now() + REFRESH_S * 1000;
  state.timer = setTimeout(refresh, REFRESH_S * 1000);
  tick();
}
function tick() {
  if (!state.last) return;
  const left = Math.max(0, Math.round((state.next - Date.now()) / 1000));
  const t = state.last;
  $("status").textContent = (demo ? "DEMO · " : "") +
    `Actualizado ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())} · próxima en ` +
    (left >= 60 ? `${Math.floor(left / 60)}m ${pad(left % 60)}s` : `${left}s`);
}
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.next && Date.now() > state.next) refresh();
});

  else if (id === "calToday") { calView = { y: now.getFullYear(), m: now.getMonth() }; calSel = SEMS[dkey(now)] ? dkey(now) : null; renderCal(); }
  else if (day) { calSel = calSel === day.dataset.date ? null : day.dataset.date; renderCal(); }
});

// ---------- proximo seminario con cuenta regresiva (bajo la fecha) ----------
function nextSemTarget() {
  const now = new Date(), t = dkey(now);
  for (const k of Object.keys(SEMS).sort()) {
    if (k < t) continue;
    const e = SEMS[k].find(x => !x.none); if (!e) continue;
    const [y, mo, d] = k.split("-").map(Number);
    let tgt = new Date(y, mo - 1, d);   // sin hora: cuenta hasta que empieza ese dia
    if (e.hora) { const [hh, mm] = e.hora.split(":").map(Number); tgt = new Date(y, mo - 1, d, hh, mm); if (now - tgt > 2 * 3600e3) continue; }
    return { k, e, tgt };
  }
  return null;
}
function renderNext() {
  const box = $("clockNext"), n = nextSemTarget();
  if (!n) { if (box.innerHTML) box.innerHTML = ""; return; }
  const ms = n.tgt - new Date(), mins = Math.floor(ms / 60000);
  const cd = ms <= 0 ? (n.e.hora ? "¡Ahora!" : "¡Hoy!") : (mins >= 1440 ? Math.floor(mins / 1440) + " d " : "") + pad(Math.floor(mins % 1440 / 60)) + " h " + pad(mins % 60) + " min";
  const [y, mo, d] = n.k.split("-").map(Number), dt = new Date(y, mo - 1, d);
  const html = `<i>Próximo seminario</i><strong>${n.e.who || "por confirmar"}</strong><i>${DIAS_LARGOS[dt.getDay()].slice(0, 3)} ${pad(d)}/${pad(mo)}${n.e.hora ? " · " + n.e.hora : ""}</i><span class="cd">${ms > 0 ? "faltan " : ""}${cd}</span>`;
  if (box.innerHTML !== html) box.innerHTML = html;
}

// ---------- noticias del mundo y de Chile (las baja un servidor cada 20 min y las publica en la rama "news") ----------
async function fetchFeed(branch, file) {   // API de GitHub (1 llamada) y, si no hay cupo, raw
  let d = null;
  try { const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${file}?ref=${branch}`, { headers: { Accept: "application/vnd.github.raw+json" } }); if (r.ok) d = await r.json(); } catch { /* sin cupo: se prueba raw */ }
  if (!d) try { const r = await fetch(`https://raw.githubusercontent.com/${REPO}/${branch}/${file}?t=${Date.now()}`, { cache: "no-store" }); if (r.ok) d = await r.json(); } catch { /* sin datos */ }
  return d && d.items && d.items.length ? d : null;
}
async function loadNews() {
  if (!REPO) return;
  const d = await fetchFeed("news", "news.json"); if (d) renderNews(d);
}
let PAPERS = [];

  let qr = "";

  $("papPop").innerHTML = `<button class="x" aria-label="Cerrar">×</button><div class="pp-body"><div class="pp-txt"><span class="pp-tag">${esc(p.k)}${p.p ? " · preprint" : ""}</span><h3><a href="${esc(p.u)}" target="_blank" rel="noopener" title="Abrir el paper">${esc(p.t)}</a></h3>` +
    `<div class="pp-meta">${esc(p.a ? p.a + " · " : "")}<b>${esc(p.s)}</b> · ${fecha}</div><p class="pp-ab">${p.ab ? esc(p.ab) : '<span style="color:var(--muted)">Sin abstract disponible: escanea el QR para ver el paper.</span>'}</p></div>` +
    `<div class="pp-qr"><div class="qr">${qr}</div><div style="margin-top:6px">Escanea con el celular para abrirlo</div></div></div>`;
  $("papPop").hidden = false; armPop($("papPop"));
}
$("papersTrack").addEventListener("click", e => { const a = e.target.closest && e.target.closest("a[data-i]"); if (!a) return; e.preventDefault(); e.stopPropagation(); showPaper(+a.dataset.i); });
$("papPop").addEventListener("click", e => { e.stopPropagation(); if (e.target.classList && e.target.classList.contains("x")) $("papPop").hidden = true; });

document.addEventListener("keydown", e => { if (e.key === "Escape") $("papPop").hidden = true; });

if (new URLSearchParams(location.search).has("paper")) setTimeout(() => showPaper(0), 3500);   // prueba: abre el primer paper

  if (!REPO) return;

  PAPERS = d.items;
  const html = d.items.map((i, n) => `<a href="${esc(i.u)}" data-i="${n}" title="${esc(i.t)}"><b>${esc(i.k)}</b>${i.q ? '<span class="st">★</span>' : ""}${esc(i.t)}<i>${esc(i.a ? i.a + " · " : "")}${esc(i.s)}${i.p ? " (preprint)" : ""}</i></a>`).join(""), tr = $("papersTrack");

function renderNews(d) {

// ---------- el tiempo (Open-Meteo, sin clave) con un monito segun el clima; al tocarlo, la semana y un mapa de Windy ----------
const WX_PLACE = { name: "Santiago", lat: -33.4489, lon: -70.6693 };   // cambiar si el laboratorio esta en otra ciudad
let WXD = null;
const WX = c => c === 0 ? ["Despejado", "☀️", "sun"] : c === 1 ? ["Mayormente despejado", "🌤️", "sun"] : c === 2 ? ["Parcialmente nublado", "⛅", "part"] : c === 3 ? ["Nublado", "☁️", "cloud"]
  : c === 45 || c === 48 ? ["Niebla", "🌫️", "fog"] : c >= 51 && c <= 57 ? ["Llovizna", "🌦️", "rain"] : c >= 61 && c <= 67 ? ["Lluvia", "🌧️", "rain"] : c >= 80 && c <= 82 ? ["Chubascos", "🌧️", "rain"]
  : c >= 71 && c <= 77 || c === 85 || c === 86 ? ["Nieve", "❄️", "snow"] : c >= 95 ? ["Tormenta", "⛈️", "storm"] : ["Sin datos", "🌡️", "cloud"];
async function loadWeather() {
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${WX_PLACE.lat}&longitude=${WX_PLACE.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&timezone=auto&forecast_days=7`;
    const r = await fetch(u); if (!r.ok) return; WXD = await r.json(); renderWeather();
  } catch { /* sin red: queda el ultimo dato */ }
}
function wxMonkey(kind, temp) {   // el mismo mono de los anillos, con ropa y accesorios segun el clima
  const A = Zoo.api, sp = A.SPECIES_BY_KIND.mono[0], NS = "http://www.w3.org/2000/svg";
  const wet = kind === "rain" || kind === "storm", cold = temp <= 12 || kind === "snow";
  const acc = wet ? { name: "capucha", a: "#f4c430", d: "#b8860b" }
    : kind === "snow" || temp <= 5 ? { name: "gorro de lana", a: "#e53935", d: "#9b1c1c" }
    : temp <= 12 ? { name: "bufanda", a: "#e53935", d: "#9b1c1c" }
    : (kind === "sun" || kind === "part") && temp >= 29 ? { name: "sombrero de paja", a: "#d84315", d: "#222" }
    : (kind === "sun" || kind === "part") && temp >= 20 ? { name: "gafas de sol", a: "#555", d: "#222" } : null;
  const m = { sp, kind: "mono", pal: A.palette(sp), dir: 1, phase: 1, t: 1, dur: 3, mode: kind === "sun" ? "cheer" : "rest", mood: { low: 0, mid: 1, high: 0 }, theta: 0, seed: 5, hop: { u: .5 }, jump: { u: .5 }, acc, celeb: null, lane: "cpu" };
  m.parts = A.build(m); A.draw(m);
  const cloud = (c1, c2) => `<ellipse cx="26" cy="15" rx="16" ry="9" fill="${c1}"/><ellipse cx="44" cy="12" rx="14" ry="8.5" fill="${c2}"/><ellipse cx="54" cy="17" rx="11" ry="7" fill="${c1}"/>`;
  const sun = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fdd835"/>` + Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4; return `<line x1="${x + Math.cos(a) * (r + 2)}" y1="${y + Math.sin(a) * (r + 2)}" x2="${x + Math.cos(a) * (r + 6)}" y2="${y + Math.sin(a) * (r + 6)}" stroke="#fdd835" stroke-width="2" stroke-linecap="round"/>`; }).join("");
  const drops = Array.from({ length: 7 }, (_, i) => `<line x1="${14 + i * 9}" y1="${26 + (i % 2) * 6}" x2="${11 + i * 9}" y2="${34 + (i % 2) * 6}" stroke="#4a90e2" stroke-width="1.8" stroke-linecap="round"/>`).join("");
  const over = { sun: sun(62, 16, 8), part: sun(60, 14, 6) + cloud("#c9d1dc", "#dde3ec"), cloud: cloud("#b3bcc9", "#c9d1dc"), fog: [20, 28, 36].map((y, i) => `<line x1="8" y1="${y}" x2="72" y2="${y}" stroke="#9aa6b6" stroke-width="3" stroke-linecap="round" opacity="${.7 - i * .15}"/>`).join(""),
    rain: cloud("#8c98aa", "#a2adbd") + drops, snow: cloud("#aeb8c6", "#c6cedb") + Array.from({ length: 6 }, (_, i) => `<circle cx="${14 + i * 10}" cy="${28 + (i % 2) * 7}" r="2" fill="#fff" stroke="#9fb4d4" stroke-width=".6"/>`).join(""),
    storm: cloud("#6f7a8c", "#86919f") + `<path d="M38 22l-7 12h6l-3 11 10-15h-6l4-8z" fill="#fdd835"/>` }[kind] || "";
  const svg = $("wxIcon"); svg.innerHTML = over;
  const g = document.createElementNS(NS, "g"); g.setAttribute("transform", "translate(40 78) scale(2.3)"); g.appendChild(m.parts.root); svg.appendChild(g);
  if (cold || wet) svg.insertAdjacentHTML("beforeend", `<path d="M30 58Q40 53 50 58L52 70Q40 74 28 70Z" fill="${wet ? "#f4c430" : "#3f6fb5"}" stroke="${wet ? "#b8860b" : "#27497e"}" stroke-width="1"/><line x1="40" y1="55" x2="40" y2="72" stroke="${wet ? "#b8860b" : "#27497e"}" stroke-width="1"/><circle cx="40" cy="62" r="1" fill="#fff"/><circle cx="40" cy="67" r="1" fill="#fff"/>`);
  if (kind === "rain" || kind === "storm") svg.insertAdjacentHTML("beforeend", `<path d="M14 40Q40 14 66 40Z" fill="#e53935"/><path d="M14 40Q27 36 40 40Q53 36 66 40" fill="none" stroke="#b71c1c" stroke-width="1"/><line x1="40" y1="40" x2="40" y2="50" stroke="#555" stroke-width="1.5"/>`);
}
function renderWeather() {
  const d = WXD; if (!d || !d.current) return;
  const t = Math.round(d.current.temperature_2m), [txt, , kind] = WX(d.current.weather_code);
  $("wxTemp").textContent = t + "°";
  $("wxText").innerHTML = `${txt}<br>mín ${Math.round(d.daily.temperature_2m_min[0])}° · máx ${Math.round(d.daily.temperature_2m_max[0])}°`;
  wxMonkey(kind, t);
  if (!$("wxPop").hidden) showWeather();
}
function showWeather() {
  const d = WXD; if (!d) return;
  const rows = d.daily.time.map((day, i) => {
    const dt = new Date(day + "T12:00"), [txt, ico] = WX(d.daily.weather_code[i]), pr = d.daily.precipitation_probability_max ? d.daily.precipitation_probability_max[i] : null;
    return `<tr><td>${i ? DIAS_LARGOS[dt.getDay()] : "hoy"} ${dt.getDate()}/${dt.getMonth() + 1}</td><td>${ico}</td><td>${txt}</td><td>${Math.round(d.daily.temperature_2m_min[i])}° / ${Math.round(d.daily.temperature_2m_max[i])}°</td><td>${pr == null ? "" : "☔ " + pr + " %"}</td></tr>`;
  }).join("");
  const { lat, lon } = WX_PLACE;
  $("wxPop").innerHTML = `<button class="x" aria-label="Cerrar">×</button><h3>${WX_PLACE.name} · el tiempo de la semana</h3><table>${rows}</table>` +
    `<iframe title="Mapa de Windy" loading="lazy" src="https://embed.windy.com/embed2.html?lat=${lat}&lon=${lon}&detailLat=${lat}&detailLon=${lon}&width=680&height=380&zoom=7&level=surface&overlay=rain&product=ecmwf&menu=&message=true&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=true&metricWind=km%2Fh&metricTemp=%C2%B0C&radarRange=-1"></iframe>` +
    `<p><a href="https://www.windy.com/${lat}/${lon}?${lat},${lon},8" target="_blank" rel="noopener">Abrir en Windy.com</a> · datos del pronóstico: Open-Meteo</p>`;
  const was = $("wxPop").hidden; $("wxPop").hidden = false; if (was) armPop($("wxPop"));
}
$("weather").onclick = e => { e.stopPropagation(); if ($("wxPop").hidden) showWeather(); else $("wxPop").hidden = true; };
$("wxPop").addEventListener("click", e => { e.stopPropagation(); if (e.target.classList && e.target.classList.contains("x")) $("wxPop").hidden = true; });
document.addEventListener("click", () => { $("wxPop").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("wxPop").hidden = true; });
loadWeather(); setInterval(loadWeather, 30 * 60e3);
{ const q = new URLSearchParams(location.search); if (q.get("wxk")) setTimeout(() => wxMonkey(q.get("wxk"), +q.get("wxt") || 15), 3000); }   // prueba: ?wxk=rain&wxt=8
if (new URLSearchParams(location.search).has("wx")) setTimeout(showWeather, 2500);   // prueba: abre el tiempo de la semana
