<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MONITO</title>
<style>
:root {
  --bg: #f4f6f9; --card: #ffffff; --text: #1b2430; --muted: #6b7686; --track: #e3e8ef; --border: #dde3ec;
  --ok: #16a34a; --warn: #f59e0b; --bad: #dc2626; --off: #9aa4b2; --accent: #2563eb; --we: #c2410c;
}
:root[data-theme="dark"] {
  --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b96a5; --track: #262d38; --border: #2a313c;
  --ok: #3fb950; --warn: #f0a030; --bad: #f85149; --off: #6b7686; --accent: #58a6ff; --we: #fb923c;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  transition: background .3s, color .3s;
}
header {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
  padding: 14px 16px; max-width: 1900px; margin: 0 auto;
}
h1 { font-size: 20px; margin: 0; letter-spacing: .12em; }
.layout { display: flex; align-items: flex-start; gap: 18px; padding: 0 16px 24px; max-width: 1900px; margin: 0 auto; }
.side { position: sticky; top: 12px; flex: none; width: clamp(150px, 16vw, 340px); }
.clock { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.05; padding: clamp(10px, 1.4vw, 24px) 8px;
  border-radius: 16px; font-variant-numeric: tabular-nums; min-height: 0; }
.clock b { font-size: clamp(30px, 4.2vw, 92px); letter-spacing: -.03em; }
.clock span { font-size: clamp(18px, 2.4vw, 48px); font-weight: 600; }
.clock small { font-size: clamp(13px, 1.5vw, 28px); color: var(--muted); text-transform: capitalize; }
@media (max-width: 900px) {
  .layout { flex-direction: column; align-items: stretch; gap: 12px; }
  .side { position: static; width: 100%; }
  .clock { flex-direction: row; justify-content: center; align-items: baseline; gap: 14px; }
  .clock b { font-size: 38px; } .clock span { font-size: 22px; } .clock small { font-size: 14px; }
}
.cal { position: absolute; left: 0; top: calc(100% + 8px); z-index: 40; width: 266px; padding: 10px; background: var(--card);
  border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.25); }
.cal[hidden] { display: none; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-weight: 700; text-transform: capitalize; }
.cal-head button { padding: 2px 10px; min-height: 28px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.cal-grid .dw { color: var(--muted); font-size: 11px; padding: 2px 0; }
.cal-grid .d { padding: 5px 0 9px; border-radius: 8px; border: 0; background: none; color: inherit; font: inherit; min-height: 0; cursor: pointer; position: relative; }
.cal-grid .d:hover { background: var(--track); }
.cal-grid .sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.cal-grid .sem::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--ok); }
.cal-grid .today.sem::after { background: #fff; }
.cal-grid .semno::after { background: none; border: 1.5px solid var(--off); width: 5px; height: 5px; }
.cal-info { margin-top: 8px; padding: 7px 9px; border-radius: 8px; background: var(--bg); font-size: 12.5px; line-height: 1.4; }
.cal-info b { font-weight: 700; }
.cal-info .muted { color: var(--muted); }
.cal-grid .we { color: var(--we); }
.cal-grid .o { opacity: .35; }
.cal-grid .today { background: var(--accent); color: #fff; font-weight: 700; }
.cal-foot { margin-top: 8px; text-align: center; }
.cal-foot button { padding: 2px 12px; min-height: 28px; font-size: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button {
  font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; min-height: 36px;
}
body { padding-bottom: 150px; }
#hud { position: fixed; left: 10px; bottom: 40px; z-index: 31; max-width: min(400px, calc(100vw - 20px)); padding: 6px 10px;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; line-height: 1.4;
  cursor: pointer; transition: opacity 1.6s; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
#hud .ev { color: var(--muted); }
#toasts { position: fixed; left: 10px; bottom: 92px; z-index: 31; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.toast { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px; font-size: 12px;
  max-width: min(380px, calc(100vw - 20px)); box-shadow: 0 2px 8px rgba(0,0,0,.12); animation: tt 7s ease forwards; }
@keyframes tt { 0% { opacity: 0; transform: translateY(8px); } 6%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
#planetPop { position: fixed; z-index: 45; width: 280px; max-height: 70vh; overflow: auto; padding: 10px 12px; background: var(--card);
  border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.28); font-size: 12.5px; line-height: 1.4; }
#planetPop[hidden] { display: none; }
#planetPop .x { float: right; padding: 0 8px; min-height: 24px; font-size: 16px; line-height: 1; }
#planetPop .sub { color: var(--muted); margin-bottom: 4px; }
#planetPop ul { margin: 6px 0; padding-left: 18px; }
#planetPop p { margin: 6px 0 0; }
#eraBanner { position: fixed; left: 50%; bottom: 130px; z-index: 32; transform: translateX(-50%); opacity: 0; pointer-events: none;
  white-space: nowrap; font-weight: 800; font-size: clamp(15px, 3vw, 26px); padding: 8px 20px; border-radius: 999px;
  background: var(--card); border: 2px solid var(--accent); box-shadow: 0 4px 18px rgba(0,0,0,.2); }
#eraBanner.on { animation: bn 4.8s ease forwards; }
@keyframes bn { 0% { opacity: 0; transform: translate(-50%, 14px); } 10%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
#btnTheme { padding: 3px 10px; min-height: 30px; font-size: 13px; }
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
main {
  display: grid; gap: 16px; padding: 0; flex: 1; min-width: 0;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
}
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 14px 12px;
  transition: opacity .3s;
}
.card.stale { opacity: .55; }
.card h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font-size: 17px; }
.card h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
.live .dot { background: var(--ok); }
svg { display: block; width: 100%; max-width: 360px; margin: 0 auto; }
.ringwrap { position: relative; max-width: 360px; margin: 0 auto; }
.ringwrap svg { max-width: none; margin: 0; }
.ringwrap .zoo { position: absolute; inset: 0; height: 100%; pointer-events: none; overflow: visible; }
svg text { fill: var(--text); text-anchor: middle; font-family: inherit; }
.seg { transition: stroke .4s; }
.row { display: flex; justify-content: space-around; font-size: 14px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.row span b { font-weight: 600; }
.legend { color: var(--muted); font-size: 12px; text-align: center; margin-top: 6px; }
.age { color: var(--muted); font-size: 12px; text-align: center; margin-top: 2px; }
footer { max-width: 1200px; margin: 0 auto; padding: 0 16px 24px; color: var(--muted); font-size: 12px; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 3px 0 8px; vertical-align: baseline; }
</style>
</head>
<body>
<header>
  <h1>MONITO</h1>
  <div class="controls">
    <span class="status" id="status" aria-live="polite">—</span>
    <button id="btnTheme" title="Cambiar color: automático (por hora), día o noche"></button>
  </div>
</header>
<div class="layout">
  <aside class="side">
    <button id="clock" class="clock" aria-haspopup="dialog" aria-expanded="false" title="Ver el calendario"><b id="clockTime">--:--</b><span id="clockDate">--/--</span><small id="clockDay"></small></button>
    <div id="cal" class="cal" role="dialog" aria-label="Calendario" hidden></div>
  </aside>
  <main id="grid"></main>
</div>
<footer>
  CPU por hilo y total: <span class="sw" style="background:var(--ok)"></span>&lt; 50 %
  <span class="sw" style="background:var(--warn)"></span>50–80 %
  <span class="sw" style="background:var(--bad)"></span>≥ 80 %.
  Anillo exterior: hilos (arco fino = CPU total). Anillo interior: RAM.
</footer>

<script src="zoo.js"></script>
<script src="world.js"></script>
<script>
// ====== Configuración ======
const REPO = "fissotta/monito"; // "usuario/monito"  (vacío = modo demo)
const MACHINES = [
  { id: "akaza",   label: "Desktop",  animal: "mono",   plural: "monos" },
  { id: "ymir",    label: "Servidor", animal: "jirafa", plural: "jirafas" },
  { id: "inozuke", label: "Servidor", animal: "foca",   plural: "focas" },
];
const REFRESH_S = 300;                 // se actualiza cada 5 minutos
const DARK_FROM = 19, DARK_TO = 7;     // modo automático: oscuro de 19:00 a 07:00
const STALE_API = 480, STALE_RAW = 780; // s sin datos nuevos => sin conexión (cron 5 min + caché API 1 min / raw 5 min)
const WARN = 50, BAD = 80;
// ===========================

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const demo = !REPO || new URLSearchParams(location.search).has("demo");
const state = { data: {}, next: 0, timer: null, stale: 300 };

// ---------- tema ----------
const THEMES = ["auto", "light", "dark"];
const THEME_LABEL = { auto: "◐ Auto", light: "☀ Día", dark: "☾ Noche" };
let theme = store.get("theme", "auto");
if (!THEMES.includes(theme)) theme = "auto";
function applyTheme() {
  const h = new Date().getHours();
  const night = h >= DARK_FROM || h < DARK_TO;
  const dark = theme === "dark" || (theme === "auto" && night);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("btnTheme").textContent = THEME_LABEL[theme];
}
$("btnTheme").onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  store.set("theme", theme); applyTheme();
};
setInterval(applyTheme, 60000);

// ---------- utilidades ----------
const color = p => p >= BAD ? "var(--bad)" : p >= WARN ? "var(--warn)" : "var(--ok)";
const pad = n => String(n).padStart(2, "0");
function fmtUp(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
function polar(r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [150 + r * Math.cos(a), 150 + r * Math.sin(a)];
}
function arc(r, a0, a1) {
  if (a1 - a0 >= 359.99) a1 = a0 + 359.99;
  const [x0, y0] = polar(r, a0), [x1, y1] = polar(r, a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

function ringSVG(d) {
  const n = d.cores.length || 1, gap = n > 32 ? 1 : 3, step = 360 / n;
  let s = `<svg viewBox="0 0 300 300" role="img" aria-label="${d.name}: CPU ${d.cpu}%, RAM ${d.ram}%">`;
  // CPU total (arco fino exterior)
  s += `<path d="${arc(142, 0, 360)}" fill="none" stroke="var(--track)" stroke-width="4"/>`;
  if (d.cpu > 0) s += `<path class="seg" d="${arc(142, 0, 3.6 * d.cpu)}" fill="none" stroke="${color(d.cpu)}" stroke-width="4" stroke-linecap="round"/>`;
  // hilos
  d.cores.forEach((p, i) => {
    const a0 = i * step + gap / 2, a1 = (i + 1) * step - gap / 2;
    s += `<path class="seg" d="${arc(122, a0, a1)}" fill="none" stroke="${color(p)}" stroke-width="18"><title>Hilo ${i}: ${p}%</title></path>`;
  });
  // RAM
  s += `<path d="${arc(92, 0, 360)}" fill="none" stroke="var(--track)" stroke-width="14"/>`;
  if (d.ram > 0) s += `<path class="seg" d="${arc(92, 0, 3.6 * d.ram)}" fill="none" stroke="${color(d.ram)}" stroke-width="14" stroke-linecap="round"/>`;
  // centro
  const load = d.load ? d.load[0].toFixed(2) : "—";
  const temp = d.temp == null ? "—" : Math.round(d.temp) + " °C";
  s += `<text x="150" y="128" font-size="11" style="fill:var(--muted)">UPTIME</text>
        <text x="150" y="153" font-size="24" font-weight="600">${fmtUp(d.uptime)}</text>
        <text x="150" y="176" font-size="13">Load ${load}</text>
        <text x="150" y="194" font-size="13">${temp} prom.</text>`;
  return s + "</svg>";
}

function render() {
  const now = Date.now() / 1000;
  $("grid").innerHTML = MACHINES.map(m => {
    const d = state.data[m.id];
    if (!d) return `<section class="card stale"><h2><span class="dot"></span>${m.id} <small>${m.label}</small></h2>
      <div class="legend" style="padding:90px 0">Sin datos</div></section>`;
    const age = now - d.ts, live = age <= state.stale;
    const ramTxt = d.ram_gb ? ` de ${d.ram_gb} GB` : "";
    return `<section class="card ${live ? "live" : "stale"}">
      <h2><span class="dot"></span>${m.id} <small>${m.label} · ${d.cores.length} hilos</small></h2>
      <div class="ringwrap">${ringSVG(d)}<svg class="zoo" data-id="${m.id}" viewBox="0 0 300 300" aria-hidden="true"></svg></div>
      <div class="row"><span>CPU <b style="color:${color(d.cpu)}">${d.cpu.toFixed(0)}%</b></span>
        <span>RAM <b style="color:${color(d.ram)}">${d.ram.toFixed(0)}%</b><small style="color:var(--muted)">${ramTxt}</small></span></div>
      <div class="age">${live ? "Dato de hace " + ago(age) : "Sin conexión · último dato hace " + ago(age)}</div>
    </section>`;
  }).join("");
}
function ago(s) {
  s = Math.round(s);
  return s < 90 ? s + " s" : s < 5400 ? Math.round(s / 60) + " min" : (s / 3600).toFixed(1) + " h";
}

// ---------- datos ----------
function fakeData(id, prev) {
  const n = { akaza: 16, ymir: 32, inozuke: 24 }[id];
  const forced = parseFloat(new URLSearchParams(location.search).get("cpu"));   // ?demo&cpu=90 fuerza la carga
  const cores = Array.from({ length: n }, () => Math.round(isNaN(forced) ? Math.random() * 100 : Math.min(100, Math.max(0, forced + (Math.random() - .5) * 30))));
  return {
    name: id, ts: Date.now() / 1000, uptime: (prev?.uptime ?? 86400 * (3 + n)) + 60,
    cpu: Math.round(cores.reduce((a, b) => a + b) / n), cores,
    ram: Math.round(30 + Math.random() * 60), ram_gb: n * 4, load: [n * Math.random() / 2, 0, 0], temp: 40 + Math.random() * 35,
  };
}
async function loadAll() {
  if (demo) return Object.fromEntries(MACHINES.map(m => [m.id, fakeData(m.id, state.data[m.id])]));
  try {   // API: caché de 60 s; una sola llamada trae los 3 equipos (límite 60/h sin token)
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/data.json?ref=data`,
      { headers: { Accept: "application/vnd.github.raw+json" } });
    if (!r.ok) throw new Error(r.status);
    state.stale = STALE_API;
    return await r.json();
  } catch (e) {   // sin cupo de API: raw.githubusercontent.com (caché de 5 min)
    const r = await fetch(`https://raw.githubusercontent.com/${REPO}/data/data.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    state.stale = STALE_RAW;
    return await r.json();
  }
}
async function refresh() {
  clearTimeout(state.timer);
  try { Object.assign(state.data, await loadAll()); } catch (e) { console.warn("monito:", e); }
  render();
  state.last = new Date();
  state.next = Date.now() + REFRESH_S * 1000;
  state.timer = setTimeout(refresh, REFRESH_S * 1000);
  tick();
}
function tick() {
  if (!state.last) return;
  const left = Math.max(0, Math.round((state.next - Date.now()) / 1000));
  const t = state.last;
  $("status").textContent = (demo ? "DEMO · " : "") +
    `Actualizado ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())} · próxima en ` +
    (left >= 60 ? `${Math.floor(left / 60)}m ${pad(left % 60)}s` : `${left}s`);
}
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.next && Date.now() > state.next) refresh();
});

// ---------- reloj y calendario ----------
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const DIAS = ["L", "M", "M", "J", "V", "S", "D"];   // la semana empieza el lunes
const DIAS_LARGOS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
let calView = null, calSel = null;
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

// seminarios.txt: una fecha por linea, p. ej. "02/nov Celia", "16/nov No hay", "2026-12-07 Celia 15:00"
let SEMS = {};   // "AAAA-MM-DD" -> [{ who, none, hora, extra }]
function monthOf(w) {
  w = w.toLowerCase().replace(/\.$/, "");
  const full = MESES.indexOf(w);
  if (full >= 0) return full;
  return { ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5, jul: 6, ago: 7, sep: 8, set: 8, oct: 9, nov: 10, dic: 11 }[w.slice(0, 3)] ?? -1;
}
function parseSems(txt) {
  const out = {}, now = new Date(); let last = null;
  for (let line of txt.split(/\r?\n/)) {
    line = line.trim();
    if (!line || line[0] === "#") continue;
    let m, d, mo, y = null, rest;
    if ((m = line.match(/^(\d{4})-(\d{1,2})-(\d{1,2})\s*[|;:,-]?\s*(.*)$/))) { y = +m[1]; mo = m[2] - 1; d = +m[3]; rest = m[4]; }
    else if ((m = line.match(/^(\d{1,2})\s*[\/.\-]\s*(\d{1,2})(?:\s*[\/.\-]\s*(\d{2,4}))?\s*[|;:,-]?\s*(.*)$/))) { d = +m[1]; mo = m[2] - 1; y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : null; rest = m[4]; }
    else if ((m = line.match(/^(\d{1,2})\s*(?:\/|-|de\s+)?\s*([A-Za-zÁÉÍÓÚáéíóú]{3,})\.?(?:\s*(?:\/|-|de)?\s*(\d{4}))?\s*[|;:,-]?\s*(.*)$/)) && monthOf(m[2]) >= 0) { d = +m[1]; mo = monthOf(m[2]); y = m[3] ? +m[3] : null; rest = m[4]; }
    else { if (last) last.extra = (last.extra ? last.extra + " · " : "") + line; continue; }   // linea sin fecha: continua la anterior
    if (mo < 0 || mo > 11 || d < 1 || d > 31) continue;
    if (y == null) {   // sin anio: el que deje la fecha mas cerca de hoy
      const c = [now.getFullYear() - 1, now.getFullYear(), now.getFullYear() + 1];
      y = c.sort((p, q) => Math.abs(new Date(p, mo, d) - now) - Math.abs(new Date(q, mo, d) - now))[0];
    }
    const hm = rest.match(/\b(\d{1,2})[:h](\d{2})\b/), hora = hm ? `${pad(+hm[1])}:${hm[2]}` : "";
    if (hm) rest = rest.replace(hm[0], "").replace(/\s{2,}/g, " ").trim();
    const e = { who: rest.replace(/^[|;:,-]\s*/, "").replace(/\s*[|;:,-]\s*$/, "").trim(), none: /^(no\s*hay|sin\s+seminario|cancelad)/i.test(rest.trim()), hora, extra: "" };
    (out[dkey(new Date(y, mo, d))] = out[dkey(new Date(y, mo, d))] || []).push(e); last = e;
  }
  return out;
}
async function loadSems() {
  try {
    const r = await fetch("seminarios.txt?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) SEMS = parseSems(await r.text());
  } catch { /* sin archivo: el calendario funciona igual */ }
  if (calView) renderCal();
}
function nextSem() {
  const t = dkey(new Date()), k = Object.keys(SEMS).sort().find(x => x >= t && SEMS[x].some(e => !e.none));
  return k ? { k, e: SEMS[k].find(e => !e.none) } : null;
}
const fmtDay = k => { const [y, m, d] = k.split("-").map(Number), dt = new Date(y, m - 1, d); return `${DIAS_LARGOS[dt.getDay()]} ${d} de ${MESES[m - 1]}`; };
const semText = e => e.none ? `<span class="muted">${e.who || "No hay seminario"}</span>` : `<b>Seminario:</b> ${e.who || "por confirmar"}${e.hora ? " · " + e.hora : ""}${e.extra ? `<br><span class="muted">${e.extra}</span>` : ""}`;
function infoHtml() {
  if (calSel) {
    const es = SEMS[calSel];
    return `<b>${fmtDay(calSel)}</b><br>` + (es ? es.map(semText).join("<br>") : `<span class="muted">Sin seminario</span>`);
  }
  const n = nextSem();
  return n ? `<span class="muted">Próximo seminario:</span><br><b>${fmtDay(n.k)}</b> · ${n.e.who || "por confirmar"}${n.e.hora ? " · " + n.e.hora : ""}` : `<span class="muted">Toca un día para ver sus seminarios</span>`;
}
function tickClock() {
  const d = new Date(), t = pad(d.getHours()) + ":" + pad(d.getMinutes()), f = pad(d.getDate()) + "/" + pad(d.getMonth() + 1);
  if ($("clockTime").textContent !== t) $("clockTime").textContent = t;
  if ($("clockDate").textContent !== f) { $("clockDate").textContent = f; $("clockDay").textContent = DIAS_LARGOS[d.getDay()]; if (calView) renderCal(); }
}
function renderCal() {
  const now = new Date(), y = calView.y, m = calView.m, lead = (new Date(y, m, 1).getDay() + 6) % 7;   // casillas vacias antes del dia 1
  let h = `<div class="cal-head"><button id="calPrev" aria-label="Mes anterior">‹</button><span>${MESES[m]} ${y}</span><button id="calNext" aria-label="Mes siguiente">›</button></div><div class="cal-grid">`;
  DIAS.forEach((d, i) => { h += `<div class="dw${i >= 5 ? " we" : ""}">${d}</div>`; });
  for (let i = 0; i < 42; i++) {   // 6 semanas fijas; los dias de otros meses van atenuados
    const d = new Date(y, m, 1 - lead + i), we = i % 7 >= 5, k = dkey(d), es = SEMS[k];
    const today = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    h += `<button class="d${we ? " we" : ""}${d.getMonth() !== m ? " o" : ""}${today ? " today" : ""}${es ? (es.every(e => e.none) ? " sem semno" : " sem") : ""}${k === calSel ? " sel" : ""}" data-date="${k}"${today ? ' aria-current="date"' : ""}>${d.getDate()}</button>`;
  }
  $("cal").innerHTML = h + `</div><div class="cal-info" id="calInfo">${infoHtml()}</div><div class="cal-foot"><button id="calToday">Hoy</button></div>`;
}
function toggleCal(open) {
  const now = new Date(), show = open == null ? $("cal").hidden : open;
  if (show) { calView = { y: now.getFullYear(), m: now.getMonth() }; calSel = SEMS[dkey(now)] ? dkey(now) : null; renderCal(); loadSems(); } else calView = null;
  $("cal").hidden = !show; $("clock").setAttribute("aria-expanded", String(show));
}
$("clock").onclick = e => { e.stopPropagation(); toggleCal(); };
$("cal").addEventListener("click", e => {
  e.stopPropagation();
  const id = e.target.id, now = new Date(), day = e.target.closest ? e.target.closest(".d") : null;
  if (id === "calPrev" || id === "calNext") { const d = new Date(calView.y, calView.m + (id === "calNext" ? 1 : -1), 1); calView = { y: d.getFullYear(), m: d.getMonth() }; renderCal(); }
  else if (id === "calToday") { calView = { y: now.getFullYear(), m: now.getMonth() }; calSel = SEMS[dkey(now)] ? dkey(now) : null; renderCal(); }
  else if (day) { calSel = calSel === day.dataset.date ? null : day.dataset.date; renderCal(); }
});
document.addEventListener("click", () => { if (!$("cal").hidden) toggleCal(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("cal").hidden) { toggleCal(false); $("clock").focus(); } });
tickClock(); setInterval(tickClock, 1000); loadSems();
if (new URLSearchParams(location.search).has("cal")) toggleCal(true);
{ const q = new URLSearchParams(location.search); const taps = q.has("sofi") ? 5 : q.has("hola") ? 1 : 0;   // prueba: toques seguidos sobre el primer animal
  if (taps) setTimeout(() => { for (const z of Object.values(Zoo._zoos)) for (let i = 0; i < taps; i++) Zoo._test.react(z.ms[0]); }, 1500); }

// ---------- monos ----------
Zoo.init(MACHINES.map(m => m.id), () => state.data, Object.fromEntries(MACHINES.map(m => [m.id, m.animal])));
Zoo.setEnabled(true);

applyTheme(); refresh();
</script>
